name: camcore-jarvis

x-runtime: &runtime
  pull_policy: always
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  jarvis-data-init:
    image: ghcr.io/camcoreau/jarvis:${CAMCORE_JARVIS_RELEASE:?Set CAMCORE_JARVIS_RELEASE to a published commit SHA}
    container_name: camcore-jarvis-data-init
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        chown 10001:10001 /data &&
        chmod 0700 /data &&
        install -d -o 10001 -g 10001 -m 0700 /data/home
    volumes:
      - jarvis-data:/data
    network_mode: none
    restart: "no"

  ollama:
    <<: *runtime
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    container_name: camcore-jarvis-ollama
    environment:
      TZ: ${CAMCORE_TZ:-Australia/Melbourne}
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ai
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-model:
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    container_name: camcore-jarvis-model-init
    environment:
      OLLAMA_HOST: http://ollama:11434
      TZ: ${CAMCORE_TZ:-Australia/Melbourne}
    command:
      - pull
      - ${CAMCORE_JARVIS_MODEL:?Set CAMCORE_JARVIS_MODEL before deployment}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai
    restart: "no"

  jarvis:
    <<: *runtime
    image: ghcr.io/camcoreau/jarvis:${CAMCORE_JARVIS_RELEASE:?Set CAMCORE_JARVIS_RELEASE to a published commit SHA}
    container_name: camcore-jarvis
    environment:
      HOME: /data/home
      OPENJARVIS_HOME: /data
      OPENJARVIS_CONFIG: /etc/openjarvis/config.toml
      OPENJARVIS_API_KEY: ${OPENJARVIS_API_KEY:?Set OPENJARVIS_API_KEY before deployment}
      OPENJARVIS_NO_UPDATE_CHECK: "1"
      OLLAMA_HOST: http://ollama:11434
      TZ: ${CAMCORE_TZ:-Australia/Melbourne}
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --engine
      - ollama
      - --model
      - ${CAMCORE_JARVIS_MODEL:?Set CAMCORE_JARVIS_MODEL before deployment}
      - --agent
      - camcore_assistant
    configs:
      - source: jarvis-config
        target: /etc/openjarvis/config.toml
    volumes:
      - jarvis-data:/data
    expose:
      - "8000"
    networks:
      - ai
      - proxy
    depends_on:
      jarvis-data-init:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read(1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

configs:
  jarvis-config:
    file: ./config.toml

volumes:
  jarvis-data:
    name: camcore-jarvis-data
  ollama-models:
    name: camcore-jarvis-ollama-models

networks:
  ai:
    name: camcore-jarvis-ai
    driver: bridge
  proxy:
    external: true
    name: ${CAMCORE_PROXY_NETWORK:?Set CAMCORE_PROXY_NETWORK to the Docker network shared with Nginx Proxy Manager}

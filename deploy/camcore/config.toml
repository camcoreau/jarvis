# Jarvis | CamCore AI — production server profile
#
# Secrets do not belong in this file. Runtime credentials are supplied through
# the container environment or OpenJarvis' credential store under /data.

[engine]
default = "ollama"

[engine.ollama]
host = "http://ollama:11434"

[intelligence]
# The compose stack passes CAMCORE_JARVIS_MODEL with --model at startup.
# Keep this conservative default aligned with the initial CamCore deployment.
default_model = "qwen3.5:4b"
provider = "local"
temperature = 0.2
max_tokens = 2048

[agent]
default_agent = "camcore_assistant"
max_turns = 10
context_from_memory = true
default_system_prompt = """
You are Jarvis, the private AI operations assistant for CamCore.
Prefer local processing, protect credentials and private infrastructure data,
and favour reversible, documented changes. Distinguish public camcore.au
services from private camcore.network services.

Use current CamCore documentation supplied through the approved server-side
knowledge integration as the authority for documented architecture, server
roles, services, policies, standards, procedures, and expected configuration.
Documentation describes intended or recorded state; it is not proof of current
runtime health. For current state, use live Operations tools when they are
available. Clearly distinguish documented information, live observations, and
proposed actions in every operational answer.

Never claim access to live monitoring, logs, YouTrack, configuration, a server,
or an execution capability unless a tool available in the current session
actually provides that access. Never claim to have performed a check or change
that no current-session tool completed successfully. If a required connector is
not configured or unavailable, say exactly which capability is unavailable
instead of inventing results.

Integration boundaries:
- Portainer provides Docker-only live access: environments, container state and
  Docker health, container CPU/memory/network statistics, redacted recent logs,
  and confirmation-gated container start/stop/restart actions.
- Better Stack provides uptime monitor and incident observations. A monitor
  observation is evidence about the configured check, not arbitrary host
  telemetry or Synology storage health.
- YouTrack provides bounded read-only issue/work context using a server-configured
  search query. It does not grant issue modification capability.
- Home Assistant only exposes state for entity IDs explicitly allow-listed
  server-side. Do not infer or request unlisted entities or location attributes.
- Microsoft 365 service health uses Microsoft Graph ServiceHealth.Read.All and
  is limited to subscribed service health and service issues.
- GitHub reads only repositories explicitly allow-listed server-side and returns
  bounded issue and Actions status. It does not provide write access.
- Synology DSM capability discovery uses SYNO.API.Info only. It does not prove or
  expose physical disk health, SMART data, storage-pool health, RAID/SHR state,
  filesystem capacity/free space, NAS hardware health, or UPS state.
- Never use or cite Portainer or Synology API discovery as evidence for those
  host/storage facts. Until a dedicated, documented storage-health source is
  implemented, state that such live checks are unavailable.
- Never infer RAID/SHR configuration from drive counts. If fetched documentation
  lists disks but does not explicitly state the storage-pool/RAID/SHR layout,
  report only the documented disk information.

Read-only inspection may proceed in Operations mode when the available tool is
authorized. Before any modifying action, establish clear intent, current state
where observable, dependencies, likely impact, rollback approach, approval
requirements, and post-change validation. Restarts, starts/stops, deployments,
configuration changes, destructive actions, security-sensitive changes, and
externally visible actions must use the confirmation controls provided by their
tools. Do not ask the user to paste API keys into chat; connector credentials
belong server-side in the Jarvis stack.
"""

[tools]
# CamCore Operations is read-first. Optional integrations remain safe to attach
# when not configured: they fail with a precise server-side configuration error
# rather than receiving credentials or arbitrary targets from the model.
enabled = [
  "web_search",
  "file_read",
  "think",
  "calculator",
  "list_documents",
  "fetch",
  "camcore_portainer_overview",
  "camcore_portainer_container_status",
  "camcore_portainer_container_logs",
  "camcore_portainer_container_action",
  "camcore_betterstack_overview",
  "camcore_youtrack_overview",
  "camcore_homeassistant_state",
  "camcore_m365_service_health",
  "camcore_github_overview",
  "camcore_synology_api_inventory",
]

[tools.storage]
default_backend = "sqlite"
db_path = "/data/memory.db"
enabled = false
facts_path = "/data/memory_facts.jsonl"

[tools.mcp]
enabled = true
servers = """
[
  {
    "name": "camcore-outline",
    "url": "http://outline:3000/mcp",
    "token_env": "CAMCORE_OUTLINE_API_KEY",
    "headers": {
      "Host": "docs.camcore.network",
      "X-Forwarded-Host": "docs.camcore.network",
      "X-Forwarded-Proto": "https"
    },
    "include_tools": ["list_documents", "fetch"]
  }
]
"""

[telemetry]
# Local inference telemetry can be enabled later once the first deployment is
# stable. It is disabled initially to minimise background work on the host.
enabled = false
db_path = "/data/telemetry.db"

[analytics]
# Do not send external OpenJarvis usage analytics from CamCore.
enabled = false

[traces]
enabled = true
db_path = "/data/traces.db"

[security]
enabled = true
profile = "server"
mode = "block"
secret_scanner = true
pii_scanner = true
enforce_tool_confirmation = true
ssrf_protection = true
rate_limit_enabled = true
rate_limit_rpm = 30
rate_limit_burst = 5
audit_log_path = "/data/audit.db"
vault_key_path = "/data/.vault_key"

[server]
host = "0.0.0.0"
port = 8000
agent = "camcore_assistant"
workers = 1
cors_origins = ["https://jarvis.camcore.network"]

[channel]
enabled = false

[scheduler]
enabled = false

[workflow]
enabled = false

[proactive]
enabled = false

[agent_manager]
enabled = true
db_path = "/data/agents.db"

[sessions]
enabled = true
db_path = "/data/sessions.db"

[memory_files]
soul_path = "/data/SOUL.md"
memory_path = "/data/MEMORY.md"
user_path = "/data/USER.md"

[skills]
enabled = true
skills_dir = "/data/skills"
auto_discover = true
auto_sync = false
index_dir = "/data/skill-index"

[compression]
enabled = true
strategy = "session_consolidation"

name: CamCore E501 autofix

on:
  push:
    branches:
      - agent/camcore-full-overhaul

permissions:
  contents: write

concurrency:
  group: camcore-e501-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/camcore-full-overhaul
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Wrap remaining CamCore long strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/openjarvis/server/camcore_operations_routes.py': [
                  (
                      '            scope="Bounded issues and Actions state for server allow-listed repositories",',
                      '            scope=(\n                "Bounded issues and Actions state for server "\n                "allow-listed repositories"\n            ),',
                  ),
                  (
                      '                "Aggregate current streams, transcode decisions, media types, session states "\n                "and bandwidth; no viewer or media-title identity"',
                      '                "Aggregate current streams, transcode decisions, "\n                "media types, session states and bandwidth; "\n                "no viewer or media-title identity"',
                  ),
                  (
                      '            scope="Storage pools, volumes, SMART, hardware and UPS require a documented dedicated source",',
                      '            scope=(\n                "Storage pools, volumes, SMART, hardware and UPS "\n                "require a documented dedicated source"\n            ),',
                  ),
                  (
                      '            "detail": "Entity-scoped read capability is attached; no bulk state query is performed.",',
                      '            "detail": (\n                "Entity-scoped read capability is attached; "\n                "no bulk state query is performed."\n            ),',
                  ),
                  (
                      '            "No current-session allow-listed Home Assistant state capability is attached.",',
                      '            (\n                "No current-session allow-listed Home Assistant "\n                "state capability is attached."\n            ),',
                  ),
              ],
              'src/openjarvis/tools/camcore_integrations.py': [
                  (
                      '                "Read the current CamCore Better Stack uptime monitor summary and unresolved "\n                "incidents. Returns monitor names/statuses and bounded incident metadata only."',
                      '                "Read the current CamCore Better Stack uptime monitor "\n                "summary and unresolved incidents. Returns monitor "\n                "names/statuses and bounded incident metadata only."',
                  ),
                  (
                      '                "Read a bounded list of CamCore YouTrack issues using the server-configured "\n                "read query. Returns issue IDs, summaries, project, resolution state and selected fields."',
                      '                "Read a bounded list of CamCore YouTrack issues using "\n                "the server-configured read query. Returns issue IDs, "\n                "summaries, project, resolution state and selected fields."',
                  ),
                  (
                      '                "Read current state for one CamCore Home Assistant entity. Only entity IDs "\n                "allow-listed server-side are accepted; location and arbitrary attributes are not returned."',
                      '                "Read current state for one CamCore Home Assistant entity. "\n                "Only entity IDs allow-listed server-side are accepted; "\n                "location and arbitrary attributes are not returned."',
                  ),
                  (
                      '                        "description": "Allow-listed Home Assistant entity ID, for example sensor.example.",',
                      '                        "description": (\n                            "Allow-listed Home Assistant entity ID, "\n                            "for example sensor.example."\n                        ),',
                  ),
                  (
                      '                    f"Home Assistant entity \'{entity_id}\' is not in the server-side allow-list."',
                      '                    (\n                        f"Home Assistant entity \'{entity_id}\' is not in "\n                        "the server-side allow-list."\n                    )',
                  ),
                  (
                      '                "Read CamCore Microsoft 365 subscribed service health and current service "\n                "issues via Microsoft Graph. Requires server-side ServiceHealth.Read.All application access."',
                      '                "Read CamCore Microsoft 365 subscribed service health "\n                "and current service issues via Microsoft Graph. "\n                "Requires server-side ServiceHealth.Read.All application access."',
                  ),
                  (
                      '                "Read bounded GitHub issue and Actions status for repositories allow-listed "\n                "server-side in CAMCORE_GITHUB_REPOSITORIES. No repository can be supplied by the model."',
                      '                "Read bounded GitHub issue and Actions status for "\n                "repositories allow-listed server-side in "\n                "CAMCORE_GITHUB_REPOSITORIES. No repository can be "\n                "supplied by the model."',
                  ),
                  (
                      '                    "CAMCORE_GITHUB_REPOSITORIES has no approved owner/repository entries."',
                      '                    (\n                        "CAMCORE_GITHUB_REPOSITORIES has no approved "\n                        "owner/repository entries."\n                    )',
                  ),
                  (
                      '                "Discover which Synology DSM WebAPI names and versions are advertised by the "\n                "configured NAS. This is capability discovery only and is not disk, SMART, RAID/SHR, volume or UPS health."',
                      '                "Discover which Synology DSM WebAPI names and versions "\n                "are advertised by the configured NAS. This is "\n                "capability discovery only and is not disk, SMART, "\n                "RAID/SHR, volume or UPS health."',
                  ),
                  (
                      '                        "This inventory does not prove physical disk, SMART, storage-pool, "\n                        "RAID/SHR, filesystem, hardware or UPS health."',
                      '                        "This inventory does not prove physical disk, SMART, "\n                        "storage-pool, RAID/SHR, filesystem, hardware or UPS "\n                        "health."',
                  ),
              ],
              'src/openjarvis/tools/camcore_tautulli.py': [
                  (
                      '                    "Tautulli returned an unexpected redirect; configure the final internal origin."',
                      '                    (\n                        "Tautulli returned an unexpected redirect; configure "\n                        "the final internal origin."\n                    )',
                  ),
              ],
          }

          for filename, items in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in items:
                  if old not in text:
                      raise SystemExit(f'Expected E501 marker moved in {filename}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Verify Ruff is clean
        shell: bash
        run: |
          files=(
            src/openjarvis/server/camcore_operations_routes.py
            src/openjarvis/tools/camcore_integrations.py
            src/openjarvis/tools/camcore_tautulli.py
          )
          uvx ruff@0.15.1 format "${files[@]}"
          uvx ruff@0.15.1 check "${files[@]}"
          uvx ruff@0.15.1 format --check "${files[@]}"

      - name: Commit clean lint fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/openjarvis/server/camcore_operations_routes.py \
            src/openjarvis/tools/camcore_integrations.py \
            src/openjarvis/tools/camcore_tautulli.py
          git commit -m 'style: wrap CamCore integration strings'
          git push origin HEAD:agent/camcore-full-overhaul

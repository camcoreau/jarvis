name: Validate and publish CamCore Jarvis image

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/camcore/**'
      - 'deploy/docker/Dockerfile'
      - 'frontend/**'
      - 'src/**'
      - 'rust/**'
      - 'scripts/install/**'
      - 'deploy/windows/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/camcore-image.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/camcore/**'
      - 'deploy/docker/Dockerfile'
      - 'frontend/**'
      - 'src/**'
      - 'rust/**'
      - 'scripts/install/**'
      - 'deploy/windows/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/camcore-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camcore-jarvis-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-deployment:
    name: Validate CamCore deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Portainer compose
        env:
          CAMCORE_JARVIS_RELEASE: ci
          CAMCORE_JARVIS_MODEL: qwen3.5:4b
          CAMCORE_PROXY_NETWORK: ci-proxy
          OPENJARVIS_API_KEY: oj_sk_ci_validation_only
          CAMCORE_TZ: Australia/Melbourne
        run: docker compose -f deploy/camcore/compose.yaml config > /tmp/camcore-jarvis-compose.yaml

      - name: Enforce private network exposure
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]+ports:' deploy/camcore/compose.yaml; then
            echo 'CamCore production compose must not publish host ports.' >&2
            exit 1
          fi
          grep -F 'external: true' deploy/camcore/compose.yaml >/dev/null
          grep -F 'read_only: true' deploy/camcore/compose.yaml >/dev/null
          if grep -Eq '^[[:space:]]+configs:' deploy/camcore/compose.yaml; then
            echo 'CamCore Portainer stack must not depend on repository-file config mounts.' >&2
            exit 1
          fi

      - name: Verify required secrets fail closed
        shell: bash
        run: |
          set +e
          CAMCORE_JARVIS_RELEASE=ci \
          CAMCORE_JARVIS_MODEL=qwen3.5:4b \
          CAMCORE_PROXY_NETWORK=ci-proxy \
          docker compose -f deploy/camcore/compose.yaml config >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Compose unexpectedly accepted a missing OPENJARVIS_API_KEY.' >&2
            exit 1
          fi

  build-pr:
    name: Build CamCore Jarvis image
    needs: validate-deployment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          push: false
          tags: camcore-jarvis:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=camcore-jarvis
          cache-to: type=gha,mode=max,scope=camcore-jarvis

      - name: Smoke-test Jarvis CLI
        run: docker run --rm camcore-jarvis:test --version

      - name: Validate baked CamCore config in production image
        shell: bash
        run: |
          docker run --rm \
            --entrypoint python \
            -e OPENJARVIS_HOME=/tmp/openjarvis \
            -e OPENJARVIS_CONFIG=/etc/openjarvis/camcore-config.toml \
            camcore-jarvis:test \
            -c 'from openjarvis.core.config import load_config; c=load_config(); assert c.server.agent == "camcore_assistant"; assert c.security.profile == "server"; assert c.analytics.enabled is False; assert c.telemetry.enabled is False; print("CamCore config ok")'

  publish:
    name: Publish immutable CamCore Jarvis image
    needs: validate-deployment
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing immutable image
        id: existing-image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/jarvis:${GITHUB_SHA}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish immutable image
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jarvis:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=camcore-jarvis
          cache-to: type=gha,mode=max,scope=camcore-jarvis

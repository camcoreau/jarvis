name: CamCore format preview

on:
  push:
    branches:
      - agent/openai-hybrid-provider

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.0.0
      - run: uv sync --extra dev --extra server
      - name: Format provider and print exact result
        run: |
          uv run ruff format src/openjarvis/server/camcore_provider.py
          echo '---CAMCORE_PROVIDER_START---'
          cat src/openjarvis/server/camcore_provider.py
          echo '---CAMCORE_PROVIDER_END---'

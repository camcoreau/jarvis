name: CamCore format preview

on:
  pull_request:
    paths:
      - "src/openjarvis/server/camcore_member_knowledge.py"
      - ".github/workflows/camcore-format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.0.0
      - run: uv sync --extra dev --extra server
      - name: Show Ruff format diff
        run: uv run ruff format --diff src/openjarvis/server/camcore_member_knowledge.py

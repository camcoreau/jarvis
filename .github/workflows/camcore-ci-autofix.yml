name: CamCore CI autofix

on:
  push:
    branches:
      - agent/camcore-full-overhaul

permissions:
  contents: write

concurrency:
  group: camcore-ci-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/camcore-full-overhaul
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Apply semantic CI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('deploy/camcore/config.toml')
          text = config.read_text()
          if 'Portainer capability boundary:' not in text:
              marker = 'Integration boundaries:\n- Portainer'
              replacement = 'Integration boundaries:\nPortainer capability boundary:\n- Portainer'
              if marker not in text:
                  raise SystemExit('Portainer boundary marker moved')
              text = text.replace(marker, replacement, 1)
              config.write_text(text)

          integrations = Path('src/openjarvis/tools/camcore_integrations.py')
          text = integrations.read_text()
          old = 'if not isinstance(issue, dict) or issue.get("pull_request"):'
          new = 'if not isinstance(issue, dict) or "pull_request" in issue:'
          if old in text:
              text = text.replace(old, new, 1)
              integrations.write_text(text)
          elif new not in text:
              raise SystemExit('GitHub issue/PR filter marker moved')
          PY

      - name: Ruff fix and format CamCore files
        shell: bash
        run: |
          files=(
            src/openjarvis/server/app.py
            src/openjarvis/server/camcore_access.py
            src/openjarvis/server/camcore_operations_routes.py
            src/openjarvis/server/camcore_portal_routes.py
            src/openjarvis/tools/camcore_integrations.py
            src/openjarvis/tools/camcore_tautulli.py
            tests/tools/test_camcore_integrations.py
            tests/tools/test_camcore_tautulli.py
          )
          uvx ruff@0.15.1 check --fix "${files[@]}" || true
          uvx ruff@0.15.1 format "${files[@]}"
          echo '--- Remaining Ruff findings after formatting ---'
          uvx ruff@0.15.1 check "${files[@]}" || true

      - name: Commit fixes to overhaul branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            deploy/camcore/config.toml \
            src/openjarvis/server/app.py \
            src/openjarvis/server/camcore_access.py \
            src/openjarvis/server/camcore_operations_routes.py \
            src/openjarvis/server/camcore_portal_routes.py \
            src/openjarvis/tools/camcore_integrations.py \
            src/openjarvis/tools/camcore_tautulli.py \
            tests/tools/test_camcore_integrations.py \
            tests/tools/test_camcore_tautulli.py
          if git diff --cached --quiet; then
            echo 'No autofix changes required.'
          else
            git commit -m 'fix: resolve CamCore overhaul CI'
            git push origin HEAD:agent/camcore-full-overhaul
          fi
